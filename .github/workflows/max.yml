# Roster de combates Max. Va aparte de datos.yml porque cambia cada pocas
# horas, mientras que el GAME_MASTER cambia como mucho una vez al día y su
# descarga son 20 MB.
name: Combates Max

on:
  schedule:
    # Cada tres horas. Los nodos energéticos rotan varias veces al día, y en
    # un repo público las Actions no cuentan contra la cuota.
    - cron: '25 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: max-battles
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Sin dejar el token en .git/config: aquí nadie hace push, y así los
      # scripts de las dependencias no lo tienen a mano.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sin `version`: la lee de `packageManager` en package.json, para que
      # CI y local no puedan irse cada uno por su lado.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Leer Snacknap y subir a Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: pnpm max
