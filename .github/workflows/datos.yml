# Mantiene al día los datos del juego.
#
# `pnpm data` los baja de PokeMiners, pvpoke, LeekDuck, PokeAPI y
# pokemon-go-api y los sube a la tabla `game_data` de Supabase, que es de
# donde los lee la app. En cuanto la tabla cambia, la app lo ve.
#
# Los JSON de public/data viajan con el despliegue como respaldo por si
# Supabase no responde, y los leen otros workflows (combates Max, noticias).
# Antes se quedaban en la foto del último commit (días o semanas atrás); ahora
# el segundo job los guarda en main cuando cambian.
name: Datos del juego

on:
  schedule:
    # 05:10 UTC. A una hora rara a propósito: en las horas en punto se
    # amontonan los workflows de todo GitHub y las ejecuciones se retrasan.
    - cron: '10 5 * * *'
  # Para poder lanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:

# Por defecto, solo leer. El job que guarda en main pide escribir para él solo.
permissions:
  contents: read

concurrency:
  group: datos-del-juego
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Sin dejar el token en .git/config: este job instala dependencias de
      # npm, y así sus scripts no tienen nada con lo que escribir en el repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sin `version`: la lee de `packageManager` en package.json, para que
      # CI y local no puedan irse cada uno por su lado.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # --must-upload hace que falle si el secreto no está: sin él, el job
      # acabaría en verde habiendo generado los ficheros y subido nada.
      - name: Generar y subir a Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: pnpm data --must-upload

      # Los JSON recién generados, para el job de abajo.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: datos
          path: public/data/*.json
          retention-days: 1
          if-no-files-found: error

  # Guarda en main el respaldo de public/data. Va aparte para que el permiso de
  # escribir lo tenga un job que no instala nada de npm: solo git y los JSON.
  guardar:
    needs: actualizar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: datos
          path: public/data

      # meta.json cambia en cada pasada (lleva la hora): solo con él no se
      # guarda nada, que sería un commit al día sin datos nuevos.
      # «[sin versión]»: no sube la versión de la app (ver version.yml), y no
      # empieza por «chore(version):», así que no avisa de versión nueva.
      - name: Guardar en main si han cambiado
        run: |
          if git diff --quiet -- public/data ':!public/data/meta.json'; then
            echo "Los datos no han cambiado: nada que guardar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "chore(datos): respaldo de public/data al día [sin versión]"
          git pull --rebase origin main
          git push origin HEAD:main
