# Traducciones automáticas de lo que LeekDuck publica en inglés.
#
# `pnpm traducir` baja de ScrapedDuck eventos y tareas, se queda con los textos
# que la app no sabe traducir sola (títulos con nombre propio, bonificaciones y
# tareas que no están entre las frases del juego), los traduce con Gemini y los
# guarda en game_data (fila `traducciones`), que la app lee con el resto de
# datos. Cada texto se traduce una sola vez, así que casi todas las pasadas no
# mandan nada o muy poco.
name: Traducciones

on:
  schedule:
    # Una vez al día, tras las noticias: los eventos se anuncian con antelación.
    - cron: '20 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traducciones
  cancel-in-progress: false

jobs:
  traducir:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Sin dejar el token en .git/config: aquí nadie hace push, y así los
      # scripts de las dependencias no lo tienen a mano.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sin `version`: la lee de `packageManager` en package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Traducir con Gemini y subir a Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pnpm traducir
