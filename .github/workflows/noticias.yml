# Noticias oficiales de Pokémon GO para el detalle de los eventos.
#
# `pnpm noticias` lee pokemongo.com/es/news (y su versión en inglés), busca a
# qué evento de LeekDuck corresponde cada noticia y guarda en game_data
# (fila `noticias`) las que tienen evento. Así el detalle de un evento enseña
# sus bonus, Pokémon destacados e investigaciones, ya en español oficial.
name: Noticias

on:
  schedule:
    # Una vez al día: los eventos se anuncian con bastante antelación.
    - cron: '50 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Sin `version`: la lee de `packageManager` en package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Leer las noticias y subir a Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: pnpm noticias
