<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <!-- viewport-fit=cover: el móvil deja pintar por debajo de su barra de
         navegación, y la barra de secciones (BottomNav) la tiñe de su color.
         Ella misma deja el hueco con env(safe-area-inset-bottom). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- La barra del navegador en móvil, del color del fondo. Esto vale para el
         primer pintado; luego la app la ajusta al tema elegido (stores/main.js). -->
    <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#374151" media="(prefers-color-scheme: dark)">
    <title>PoGoDex</title>
    <!-- La fuente es nuestra (src/assets/base.css): se pide ya, sin esperar a
         que el CSS diga que hace falta. -->
    <link rel="preload" href="/src/assets/fonts/source-code-pro-latin.woff2" as="font" type="font/woff2" crossorigin>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
